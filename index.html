<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panel SMR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
  :root{
    --bg:#eef0f4; --surface:#ffffff; --surface-2:#e7e9ef; --border:#d4d8e1;
    --text:#14161c; --text-dim:#575d6c; --accent:#0c7d70; --accent-ink:#ffffff;
    --danger:#c0392b; --today-ring:#0c7d70;
    --ing:#7b52b8; --ing-t:#ffffff;
    --sr:#d85f52; --sr-t:#ffffff;
    --seg:#f0ad00; --seg-t:#2a1e00;
    --web:#bb2e39; --web-t:#ffffff;
    --sor:#2f5f9e; --sor-t:#ffffff;
    --ipe:#2f9457; --ipe-t:#ffffff;
    --pro:#9b3690; --pro-t:#ffffff;
    --hlc:#1f8f88; --hlc-t:#ffffff;
    --rec:#9aa0ad; --rec-t:#1a1c22;
    font-size:16px;
  }
  [data-theme="dark"]{
    --bg:#0f1116; --surface:#181b22; --surface-2:#1f232c; --border:#2b303b;
    --text:#f1f2f6; --text-dim:#a0a6b5; --accent:#3fd8c4; --accent-ink:#062521;
    --danger:#f0776a; --today-ring:#3fd8c4;
    --ing:#9b7bd6; --ing-t:#1c1030;
    --sr:#e8836f; --sr-t:#2b0f08;
    --seg:#f5c23c; --seg-t:#2a1e00;
    --web:#e15a5a; --web-t:#2b0808;
    --sor:#5f8fce; --sor-t:#08131f;
    --ipe:#54bf7b; --ipe-t:#08210f;
    --pro:#c561ba; --pro-t:#2a0d25;
    --hlc:#3fbdb3; --hlc-t:#052422;
    --rec:#2b303b; --rec-t:#c3c8d4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  ::selection{ background:var(--accent); color:var(--accent-ink); }

  .topbar{
    position:sticky; top:0; top:env(safe-area-inset-top,0px); z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px clamp(16px,4vw,40px);
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:36px; height:36px; border-radius:10px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; color:var(--accent-ink); flex-shrink:0;
  }
  .brand h1{ font-size:1.1rem; font-weight:800; letter-spacing:-.01em; }
  .brand span{ display:block; font-size:.75rem; color:var(--text-dim); font-weight:500; }

  .theme-toggle{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:100px; padding:6px 14px 6px 6px; cursor:pointer;
    color:var(--text); font-family:inherit; font-size:.85rem; font-weight:600;
  }
  .theme-toggle .dot{
    width:24px; height:24px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; color:var(--accent-ink);
  }
  .theme-toggle svg{ width:14px; height:14px; }

  .layout{
    max-width:1280px; margin:0 auto; padding:clamp(18px,3.5vw,36px);
    display:grid; grid-template-columns:1fr; gap:22px;
  }
  @media(min-width:900px){ .layout{ grid-template-columns:1fr 220px; align-items:start; } }

  nav.index-nav{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    order:-1;
  }
  @media(min-width:900px){
    nav.index-nav{
      order:2; flex-direction:column; gap:6px; position:sticky;
      top:calc(env(safe-area-inset-top,0px) + 88px);
      background:var(--surface); border:1px solid var(--border); border-radius:14px;
      padding:14px; overflow-x:visible;
    }
  }
  .index-title{ font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); padding:0 6px 8px; display:none; }
  @media(min-width:900px){ .index-title{ display:block; } }
  .index-link{
    display:flex; align-items:center; gap:10px; white-space:nowrap;
    padding:10px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-family:inherit;
    font-size:.85rem; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  @media(min-width:900px){ .index-link{ border:1px solid transparent; background:transparent; width:100%; } }
  .index-link svg{ width:16px; height:16px; flex-shrink:0; opacity:.8; }
  .index-link:hover{ background:var(--border); }
  .index-link.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .index-link.active svg{ opacity:1; }

  main.content{ order:1; display:flex; flex-direction:column; gap:22px; min-width:0; }
  .page{ display:none; flex-direction:column; gap:18px; }
  .page.active{ display:flex; }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:1.5rem; font-weight:800; letter-spacing:-.01em; }
  .section-head p{ color:var(--text-dim); font-size:.9rem; }

  .schedule-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:16px; background:var(--surface); }
  table.sched{ width:100%; border-collapse:collapse; min-width:760px; }
  table.sched thead th{
    background:var(--surface-2); color:var(--text-dim);
    font-size:.76rem; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
    padding:14px 10px; border-bottom:2px solid var(--border); text-align:left;
  }
  table.sched thead th:first-child{ width:128px; }
  .time-cell{
    padding:18px 14px; font-size:.88rem; font-weight:800; color:var(--text-dim);
    border-right:2px solid var(--border); border-bottom:1px solid var(--border);
    white-space:nowrap; background:var(--surface);
  }
  .subj-cell{
    padding:18px 12px; border-bottom:1px solid var(--border); border-left:1px solid rgba(0,0,0,.06);
    font-size:.95rem; font-weight:700; text-align:center; vertical-align:middle;
    position:relative; letter-spacing:.01em;
  }
  .subj-cell.rec{ font-size:.8rem; text-transform:uppercase; letter-spacing:.1em; font-weight:800; }
  .subj-cell.now{
    outline:3px solid var(--today-ring); outline-offset:-3px;
    box-shadow:0 0 0 6px color-mix(in srgb, var(--today-ring) 28%, transparent);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 6px color-mix(in srgb, var(--today-ring) 28%, transparent); }
    50%{ box-shadow:0 0 0 9px color-mix(in srgb, var(--today-ring) 12%, transparent); }
  }
  .subj-cell.now::after{
    content:'AHORA'; position:absolute; top:5px; right:7px;
    font-size:.6rem; font-weight:900; letter-spacing:.06em;
    background:rgba(0,0,0,.22); padding:1px 6px; border-radius:5px;
  }
  tr.rec-row td{ border-bottom:1px solid var(--border); }

  .c-ing{ background:var(--ing); color:var(--ing-t); }
  .c-sr{ background:var(--sr); color:var(--sr-t); }
  .c-seg{ background:var(--seg); color:var(--seg-t); }
  .c-web{ background:var(--web); color:var(--web-t); }
  .c-sor{ background:var(--sor); color:var(--sor-t); }
  .c-ipe{ background:var(--ipe); color:var(--ipe-t); }
  .c-pro{ background:var(--pro); color:var(--pro-t); }
  .c-hlc{ background:var(--hlc); color:var(--hlc-t); }
  .c-rec{ background:var(--rec); color:var(--rec-t); }

  .legend{ display:flex; flex-wrap:wrap; gap:10px 18px; padding:2px 4px; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:.8rem; font-weight:600; color:var(--text-dim); }
  .legend-swatch{ width:13px; height:13px; border-radius:4px; flex-shrink:0; }

  .grid-two{ display:grid; grid-template-columns:1fr; gap:20px; }
  @media(min-width:760px){ .grid-two{ grid-template-columns:minmax(300px,380px) 1fr; align-items:start; } }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; }

  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-head strong{ font-size:1rem; font-weight:800; text-transform:capitalize; }
  .icon-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn:hover{ background:var(--border); }
  .icon-btn svg{ width:17px; height:17px; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-dow{ text-align:center; font-size:.7rem; font-weight:800; color:var(--text-dim); padding-bottom:6px; text-transform:uppercase; }
  .cal-day{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; font-size:.86rem; font-weight:700; cursor:pointer; position:relative;
    background:transparent; border:1px solid transparent; color:var(--text);
  }
  .cal-day:hover{ background:var(--surface-2); }
  .cal-day.muted{ color:var(--text-dim); opacity:.4; cursor:default; }
  .cal-day.muted:hover{ background:transparent; }
  .cal-day.today{ border-color:var(--accent); }
  .cal-day.selected{ background:var(--accent); color:var(--accent-ink); }
  .cal-dots{ display:flex; gap:2px; position:absolute; bottom:5px; }
  .cal-dots span{ width:4px; height:4px; border-radius:50%; background:var(--accent); }
  .cal-day.selected .cal-dots span{ background:var(--accent-ink); }

  .task-form{ display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:18px; }
  @media(min-width:520px){ .task-form{ grid-template-columns:2fr 1fr 1fr auto; align-items:end; } }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:.72rem; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }
  input, select{
    font-family:inherit; font-size:.9rem; padding:10px 12px;
    border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--text);
  }
  input:focus, select:focus, button:focus-visible, .icon-btn:focus-visible, .cal-day:focus-visible, .index-link:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .btn-add{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px;
    padding:10px 18px; font-family:inherit; font-weight:800; font-size:.9rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap;
  }
  .btn-add:hover{ opacity:.9; }
  .btn-add svg{ width:16px; height:16px; }

  .filters{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    padding:7px 14px; border-radius:100px; font-family:inherit; font-size:.8rem; font-weight:800; cursor:pointer;
  }
  .filter-btn.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .task-list{ display:flex; flex-direction:column; gap:9px; }
  .task-item{
    display:flex; align-items:center; gap:12px; padding:12px 13px;
    border:1px solid var(--border); border-radius:11px; background:var(--surface-2);
  }
  .task-check{
    width:22px; height:22px; border-radius:7px; border:2px solid var(--text-dim);
    flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; background:transparent;
  }
  .task-check svg{ width:14px; height:14px; opacity:0; color:var(--accent-ink); }
  .task-item.done .task-check{ background:var(--accent); border-color:var(--accent); }
  .task-item.done .task-check svg{ opacity:1; }
  .task-body{ flex:1; min-width:0; }
  .task-title{ font-size:.9rem; font-weight:700; overflow-wrap:break-word; }
  .task-item.done .task-title{ text-decoration:line-through; color:var(--text-dim); }
  .task-meta{ display:flex; gap:8px; align-items:center; margin-top:3px; }
  .task-tag{ font-size:.66rem; font-weight:900; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:6px; }
  .task-tag.tarea{ background:var(--sor); color:var(--sor-t); }
  .task-tag.examen{ background:var(--web); color:var(--web-t); }
  .task-date{ font-size:.74rem; color:var(--text-dim); font-weight:700; }
  .task-del{ background:none; border:none; color:var(--text-dim); cursor:pointer; flex-shrink:0; display:flex; padding:5px; border-radius:7px; }
  .task-del:hover{ color:var(--danger); background:var(--surface); }
  .task-del svg{ width:18px; height:18px; }
  .empty-state{ text-align:center; padding:32px 10px; color:var(--text-dim); font-size:.88rem; }
  .empty-state svg{ width:28px; height:28px; margin-bottom:8px; opacity:.6; }

  footer{ text-align:center; padding:26px; color:var(--text-dim); font-size:.76rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark"><i data-lucide="graduation-cap"></i></div>
    <div>
      <h1>Panel Académico</h1>
      <span>Horario · Calendario · Tareas</span>
    </div>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
    <span class="dot"><i data-lucide="sun" id="themeIcon"></i></span>
    <span id="themeLabel">Claro</span>
  </button>
</header>

<div class="layout">

  <main class="content" id="content">

    <section class="page active" id="page-horario" data-page="horario">
      <div class="section-head">
        <h2>Horario semanal</h2>
        <p>La clase en curso se resalta automáticamente</p>
      </div>
      <div class="schedule-wrap">
        <table class="sched" id="schedTable">
          <thead>
            <tr><th>Horas</th><th>Lunes</th><th>Martes</th><th>Miércoles</th><th>Jueves</th><th>Viernes</th></tr>
          </thead>
          <tbody id="schedBody"></tbody>
        </table>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="page" id="page-calendario" data-page="calendario">
      <div class="section-head"><h2>Calendario y tareas</h2></div>
      <div class="grid-two">
        <div class="card">
          <div class="cal-head">
            <button class="icon-btn" id="prevMonth" aria-label="Mes anterior"><i data-lucide="chevron-left"></i></button>
            <strong id="calLabel"></strong>
            <button class="icon-btn" id="nextMonth" aria-label="Mes siguiente"><i data-lucide="chevron-right"></i></button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>

        <div class="card">
          <form class="task-form" id="taskForm">
            <div class="field">
              <label for="taskTitle">Descripción</label>
              <input type="text" id="taskTitle" placeholder="Ej. Práctica de SOR" required>
            </div>
            <div class="field">
              <label for="taskType">Tipo</label>
              <select id="taskType">
                <option value="tarea">Tarea</option>
                <option value="examen">Examen</option>
              </select>
            </div>
            <div class="field">
              <label for="taskDate">Fecha</label>
              <input type="date" id="taskDate" required>
            </div>
            <button type="submit" class="btn-add"><i data-lucide="plus"></i>Añadir</button>
          </form>

          <div class="filters">
            <button class="filter-btn active" data-filter="todos">Todos</button>
            <button class="filter-btn" data-filter="tarea">Solo tareas</button>
            <button class="filter-btn" data-filter="examen">Solo exámenes</button>
          </div>

          <div class="task-list" id="taskList"></div>
        </div>
      </div>
    </section>

  </main>

  <nav class="index-nav" id="indexNav" aria-label="Índice de páginas">
    <span class="index-title">Índice</span>
    <button class="index-link active" data-target="horario"><i data-lucide="calendar-clock"></i>Horario</button>
    <button class="index-link" data-target="calendario"><i data-lucide="calendar-days"></i>Calendario</button>
  </nav>

</div>

<footer>Tus datos se guardan localmente en este navegador.</footer>

<script>
(function(){
  "use strict";
  try{

  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const themeLabel = document.getElementById('themeLabel');

  function applyTheme(t){
    if(t === 'dark'){ root.setAttribute('data-theme','dark'); themeLabel.textContent='Oscuro'; }
    else { root.removeAttribute('data-theme'); themeLabel.textContent='Claro'; }
    themeIcon.setAttribute('data-lucide', t === 'dark' ? 'moon' : 'sun');
    if(window.lucide) lucide.createIcons();
  }
  let savedTheme = 'light';
  try{ savedTheme = localStorage.getItem('panel-theme') || 'light'; }catch(e){}
  applyTheme(savedTheme);
  themeToggle.addEventListener('click', function(){
    savedTheme = savedTheme === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem('panel-theme', savedTheme); }catch(e){}
    applyTheme(savedTheme);
  });

  const SLOTS = [
    {start:"8:15",  end:"9:15",  label:"8:15 - 9:15"},
    {start:"9:15",  end:"10:15", label:"9:15 - 10:15"},
    {start:"10:15", end:"11:15", label:"10:15 - 11:15"},
    {start:"11:15", end:"11:45", label:"11:15 - 11:45", recess:true},
    {start:"11:45", end:"12:45", label:"11:45 - 12:45"},
    {start:"12:45", end:"13:45", label:"12:45 - 13:45"},
    {start:"13:45", end:"14:45", label:"13:45 - 14:45"}
  ];
  const DATA = {
    1:["Inglés","Inglés","Ipe II","Ipe II","Proyecto","Proyecto"],
    2:["Servicios en red","Ap.Web","Seguridad","SOR","SOR","HLC"],
    3:["Servicios en red","Servicios en red","Ap.Web","Seguridad","Ipe II","HLC"],
    4:["Seguridad","Servicios en red","SOR","SOR","Ap.Web","HLC"],
    5:["Ap.Web","SOR","SOR","Servicios en red","Servicios en Red","Seguridad"]
  };
  const COLOR_CLASS = {
    "Inglés":"c-ing", "Servicios en red":"c-sr", "Servicios en Red":"c-sr",
    "Seguridad":"c-seg", "Ap.Web":"c-web", "SOR":"c-sor", "Ipe II":"c-ipe",
    "Proyecto":"c-pro", "HLC":"c-hlc"
  };
  const LEGEND_ORDER = ["Inglés","Servicios en red","Seguridad","Ap.Web","SOR","Ipe II","Proyecto","HLC"];

  function toMinutes(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }

  function renderLegend(){
    const legend = document.getElementById('legend');
    legend.innerHTML = '';
    LEGEND_ORDER.forEach(subj => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      const sw = document.createElement('span');
      sw.className = 'legend-swatch ' + COLOR_CLASS[subj];
      const label = document.createElement('span');
      label.textContent = subj;
      item.appendChild(sw); item.appendChild(label);
      legend.appendChild(item);
    });
  }

  function renderSchedule(){
    const tbody = document.getElementById('schedBody');
    tbody.innerHTML = '';
    const now = new Date();
    const curDay = now.getDay();
    const curMin = now.getHours()*60 + now.getMinutes();

    let dataRow = 0;
    SLOTS.forEach(slot => {
      const tr = document.createElement('tr');
      const tTd = document.createElement('td');
      tTd.className = 'time-cell';
      tTd.textContent = slot.label;
      tr.appendChild(tTd);

      if(slot.recess){
        tr.className = 'rec-row';
        const td = document.createElement('td');
        td.className = 'subj-cell rec c-rec';
        td.colSpan = 5;
        td.textContent = 'RECREO';
        if(curDay>=1 && curDay<=5 && curMin>=toMinutes(slot.start) && curMin<toMinutes(slot.end)){
          td.classList.add('now');
        }
        tr.appendChild(td);
      } else {
        for(let d=1; d<=5; d++){
          const subj = DATA[d][dataRow];
          const td = document.createElement('td');
          td.className = 'subj-cell ' + (COLOR_CLASS[subj] || '');
          td.textContent = subj;
          if(d===curDay && curMin>=toMinutes(slot.start) && curMin<toMinutes(slot.end)){
            td.classList.add('now');
          }
          tr.appendChild(td);
        }
        dataRow++;
      }
      tbody.appendChild(tr);
    });
  }
  renderSchedule();
  renderLegend();
  setInterval(renderSchedule, 60000);

  const STORE_KEY = 'panel-tasks';
  function loadTasks(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; }
  }
  function saveTasks(tasks){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); }catch(e){}
  }
  let tasks = loadTasks();
  let currentFilter = 'todos';

  const calLabel = document.getElementById('calLabel');
  const calGrid = document.getElementById('calGrid');
  const taskDateInput = document.getElementById('taskDate');
  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedDate = null;

  const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const DOWS = ["L","M","X","J","V","S","D"];

  function fmtDate(y,m,d){
    return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  }

  function renderCalendar(){
    calLabel.textContent = MONTHS[viewMonth] + ' ' + viewYear;
    calGrid.innerHTML = '';
    DOWS.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      calGrid.appendChild(el);
    });

    const firstDay = new Date(viewYear, viewMonth, 1);
    let startOffset = firstDay.getDay() - 1;
    if(startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    const eventDates = new Set(tasks.map(t => t.date));

    for(let i=0; i<startOffset; i++){
      const el = document.createElement('div');
      el.className = 'cal-day muted';
      el.textContent = daysInPrevMonth - startOffset + i + 1;
      calGrid.appendChild(el);
    }
    for(let d=1; d<=daysInMonth; d++){
      const el = document.createElement('div');
      const dateStr = fmtDate(viewYear, viewMonth, d);
      el.className = 'cal-day';
      el.tabIndex = 0;
      el.textContent = d;
      if(dateStr === fmtDate(today.getFullYear(), today.getMonth(), today.getDate())){
        el.classList.add('today');
      }
      if(dateStr === selectedDate){
        el.classList.add('selected');
      }
      if(eventDates.has(dateStr)){
        const dots = document.createElement('div');
        dots.className = 'cal-dots';
        dots.appendChild(document.createElement('span'));
        el.appendChild(dots);
      }
      el.addEventListener('click', function(){
        selectedDate = dateStr;
        taskDateInput.value = dateStr;
        renderCalendar();
      });
      calGrid.appendChild(el);
    }
    const totalCells = startOffset + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for(let i=1; i<=trailing; i++){
      const el = document.createElement('div');
      el.className = 'cal-day muted';
      el.textContent = i;
      calGrid.appendChild(el);
    }
  }
  document.getElementById('prevMonth').addEventListener('click', function(){
    viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; }
    renderCalendar();
  });
  renderCalendar();

  const taskForm = document.getElementById('taskForm');
  const taskList = document.getElementById('taskList');
  const taskTitle = document.getElementById('taskTitle');
  const taskType = document.getElementById('taskType');

  function renderTasks(){
    taskList.innerHTML = '';
    let visible = tasks.filter(t => currentFilter === 'todos' || t.type === currentFilter);
    visible = visible.slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));

    if(visible.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<i data-lucide="calendar-check"></i><div>No hay elementos todavía. Añade tu primera tarea o examen arriba.</div>';
      taskList.appendChild(empty);
      if(window.lucide) lucide.createIcons();
      return;
    }

    visible.forEach(t => {
      const item = document.createElement('div');
      item.className = 'task-item' + (t.done ? ' done' : '');

      const check = document.createElement('button');
      check.className = 'task-check';
      check.setAttribute('aria-label','Marcar como completado');
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      check.addEventListener('click', function(){
        t.done = !t.done;
        saveTasks(tasks);
        renderTasks();
      });

      const body = document.createElement('div');
      body.className = 'task-body';
      const title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = t.title;
      const meta = document.createElement('div');
      meta.className = 'task-meta';
      const tag = document.createElement('span');
      tag.className = 'task-tag ' + t.type;
      tag.textContent = t.type === 'examen' ? 'Examen' : 'Tarea';
      const dateSpan = document.createElement('span');
      dateSpan.className = 'task-date';
      dateSpan.textContent = t.date ? new Date(t.date+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}) : '';
      meta.appendChild(tag);
      meta.appendChild(dateSpan);
      body.appendChild(title);
      body.appendChild(meta);

      const del = document.createElement('button');
      del.className = 'task-del';
      del.setAttribute('aria-label','Eliminar');
      del.innerHTML = '<i data-lucide="trash-2"></i>';
      del.addEventListener('click', function(){
        tasks = tasks.filter(x => x.id !== t.id);
        saveTasks(tasks);
        renderTasks();
        renderCalendar();
      });

      item.appendChild(check);
      item.appendChild(body);
      item.appendChild(del);
      taskList.appendChild(item);
    });
    if(window.lucide) lucide.createIcons();
  }

  taskForm.addEventListener('submit', function(e){
    e.preventDefault();
    const title = taskTitle.value.trim();
    const date = taskDateInput.value;
    if(!title || !date) return;
    tasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      title: title,
      type: taskType.value,
      date: date,
      done: false
    });
    saveTasks(tasks);
    taskTitle.value = '';
    renderTasks();
    renderCalendar();
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTasks();
    });
  });

  renderTasks();

  if(window.lucide) lucide.createIcons();
  else document.addEventListener('DOMContentLoaded', function(){ if(window.lucide) lucide.createIcons(); });

  const navLinks = document.querySelectorAll('.index-link');
  function goToPage(id){
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.dataset.page === id));
    navLinks.forEach(l => l.classList.toggle('active', l.dataset.target === id));
    try{ localStorage.setItem('panel-page', id); }catch(e){}
    try{ if(history.replaceState) history.replaceState(null, '', '#' + id); }catch(e){}
  }
  navLinks.forEach(link => link.addEventListener('click', () => goToPage(link.dataset.target)));
  let startPage = 'horario';
  try{ startPage = (location.hash && location.hash.slice(1)) || localStorage.getItem('panel-page') || 'horario'; }catch(e){}
  if(!document.getElementById('page-' + startPage)) startPage = 'horario';
  goToPage(startPage);

  }catch(err){
    console.error('Panel Académico: error de inicialización', err);
  }
})();
</script>
</body>
</html>
